<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive JSON Viewer</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h2 { cursor: pointer; background: #f0f0f0; padding: 5px; border-radius: 5px; margin: 2px 0; }
.section { margin-left: 20px; display: none; }
.array-item { margin-left: 20px; }
textarea { width: 100%; }
button { margin-top: 10px; padding: 5px 10px; }
</style>
</head>
<body>

<h1>Interactive Paper JSON Viewer</h1>

<textarea id="jsonInput" rows="10" placeholder="Paste JSON here"></textarea><br>
<button onclick="loadJSON()">Load JSON</button>
<button onclick="downloadJSON()">Download JSON</button>

<div id="viewer"></div>

<script>
// Toggle collapsible section
function toggleSection(event) {
  const next = event.target.nextElementSibling;
  if (next) next.style.display = next.style.display === 'none' ? 'block' : 'none';
}

// Create collapsible view for JSON
function createCollapsible(obj) {
  const container = document.createElement('div');

  if (Array.isArray(obj)) {
    // Display array as list
    obj.forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'array-item';
      if (typeof item === 'object' && item !== null) {
        const h2 = document.createElement('h2');
        h2.textContent = '[Object]';
        h2.onclick = toggleSection;
        const section = document.createElement('div');
        section.className = 'section';
        section.appendChild(createCollapsible(item));
        itemDiv.appendChild(h2);
        itemDiv.appendChild(section);
      } else {
        itemDiv.textContent = item;
      }
      container.appendChild(itemDiv);
    });
  } else if (typeof obj === 'object' && obj !== null) {
    // Display object keys
    for (const key in obj) {
      const h2 = document.createElement('h2');
      h2.textContent = key;
      h2.onclick = toggleSection;
      const section = document.createElement('div');
      section.className = 'section';
      section.appendChild(createCollapsible(obj[key]));
      container.appendChild(h2);
      container.appendChild(section);
    }
  } else {
    // Display primitive values
    const p = document.createElement('div');
    p.textContent = obj;
    container.appendChild(p);
  }

  return container;
}

// Load JSON from textarea
function loadJSON() {
  const input = document.getElementById('jsonInput').value;
  if (!input) return alert('Please paste JSON!');
  let data;
  try { data = JSON.parse(input); } 
  catch (e) { return alert('Invalid JSON: ' + e.message); }

  const viewer = document.getElementById('viewer');
  viewer.innerHTML = '';

  if (Array.isArray(data)) {
    data.forEach((paper, idx) => {
      const title = paper.document_metadata?.title || `Paper ${idx + 1}`;
      const h1 = document.createElement('h1');
      h1.textContent = title;
      viewer.appendChild(h1);
      viewer.appendChild(createCollapsible(paper));
    });
  } else {
    viewer.appendChild(createCollapsible(data));
  }
}

// Download JSON
function downloadJSON() {
  const input = document.getElementById('jsonInput').value;
  if (!input) return alert('No JSON to download!');
  const blob = new Blob([input], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'paper_data.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
